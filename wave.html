<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Rx7ezz Music</title>
<style>
:root{--bg:#09090b;--panel:#111116;--panel2:#18181f;--text:#f7f7fa;--muted:#8e8e99;--line:#25252d;--accent:#a78bfa;--accent2:#7c3aed}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(800px 400px at 85% -5%,#251442 0,transparent 60%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:132px;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}
header{height:66px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(9,9,11,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:20;border-bottom:1px solid rgba(255,255,255,.04)}
.brand{font-size:21px;font-weight:900;letter-spacing:-.8px}.brand i{font-style:normal;color:var(--accent)}.headActions{display:flex;gap:8px}.icon{border:1px solid var(--line);background:rgba(255,255,255,.045);width:38px;height:38px;border-radius:12px;font-size:17px}.icon:active{transform:scale(.95)}
.hero{padding:28px 16px 20px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--muted);font-weight:800;margin:0 0 9px}.hero h1{font-size:38px;line-height:1;letter-spacing:-2px;margin:0 0 22px}.hero h1 span{color:var(--accent)}
.search{height:52px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.055);display:flex;align-items:center;padding:0 14px;gap:10px;transition:.2s}.search:focus-within{border-color:#51406e;box-shadow:0 0 0 3px rgba(167,139,250,.08)}.searchIcon{font-size:21px;color:#aaa}.search input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:16px}.search input::placeholder{color:#777782}.clear{display:none;border:0;background:#2b2b33;color:#aaa;width:25px;height:25px;border-radius:50%}.clear.show{display:block}
.tabs{display:flex;gap:8px;padding:0 16px 4px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}.tab.active{background:var(--text);color:#09090b;border-color:var(--text)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;padding:24px 16px 11px}.sectionHead h2{font-size:19px;letter-spacing:-.4px;margin:0}.sectionHead button{border:0;background:none;color:var(--accent);font-size:13px;font-weight:800}
.tracks{padding:0 10px}.track{display:flex;align-items:center;gap:11px;padding:9px 7px;border-radius:15px;min-height:70px;transition:background .15s}.track:active,.track.active{background:#17171d}.track.active .meta b{color:var(--accent)}.cover{width:52px;height:52px;border-radius:11px;background:linear-gradient(135deg,#a78bfa,#30233f);flex:none;display:grid;place-items:center;font-weight:900;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.meta{min-width:0;flex:1}.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta b{font-size:14px}.meta span{font-size:12px;color:var(--muted);margin-top:4px}.duration{color:#676771;font-size:11px;font-variant-numeric:tabular-nums}.more{background:none;border:0;color:#777;font-size:21px;width:28px;height:36px}
.artists{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:0 16px}.artist{text-align:center;min-width:0}.artistBtn{border:0;background:none;padding:0;width:100%;color:inherit}.avatar{width:66px;height:66px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#29202f);display:grid;place-items:center;font-size:22px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.artistName{display:block;margin-top:8px;font-size:11px;color:#d0d0d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{display:block;color:#666670;font-size:10px;margin-top:3px}
.searchResults{display:none}.searchResults.show{display:block}.homeSections.hide{display:none}.resultTitle{padding:20px 16px 9px;font-size:12px;text-transform:uppercase;letter-spacing:1.7px;color:var(--muted);font-weight:800}.artistResults{display:flex;gap:10px;padding:0 16px;overflow:auto;scrollbar-width:none}.artistResults::-webkit-scrollbar{display:none}.resultArtist{min-width:92px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;padding:10px 7px;text-align:center}.resultArtist .avatar{width:54px;height:54px;font-size:18px}.empty{padding:28px 16px;color:#777782;text-align:center;font-size:13px;line-height:1.5}.empty b{color:#bbb}
.player{position:fixed;left:9px;right:9px;bottom:9px;border:1px solid #2b2635;border-radius:20px;background:rgba(21,18,28,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:9px 11px 8px;z-index:50;box-shadow:0 18px 50px rgba(0,0,0,.55)}.player.hidden{display:none}.playerTop{display:flex;align-items:center;gap:10px}.player .cover{width:48px;height:48px;border-radius:12px}.pinfo{min-width:0;flex:1}.pinfo b,.pinfo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pinfo b{font-size:13px}.pinfo span{font-size:11px;color:#92929b;margin-top:3px}.ctrls{display:flex;align-items:center;gap:2px}.ctrl{border:0;background:transparent;width:32px;height:36px;border-radius:50%;font-size:14px}.ctrl:active{background:#2a2630}.play{border:0;background:var(--accent);color:#0b0910;width:40px;height:40px;border-radius:50%;font-weight:900}.progress{display:flex;align-items:center;gap:7px;margin-top:6px}.t{font-size:9px;color:#777783;min-width:30px;text-align:center}.bar{flex:1;height:3px;accent-color:var(--accent);cursor:pointer}
@media(min-width:700px){body{max-width:900px;margin:auto}.artists{grid-template-columns:repeat(7,1fr)}.hero{padding-top:45px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<header><div class="brand">Rx7ezz Music<i>.</i></div><div class="headActions"><button id="syncBtn" class="icon" aria-label="Обновить">↻</button><button id="profileBtn" class="icon" aria-label="Профиль">◉</button></div></header>
<main>
<section class="hero"><p class="eyebrow">YOUR MUSIC</p><h1>Слушай.<br><span>Чувствуй.</span></h1><div class="search"><span class="searchIcon">⌕</span><input id="search" autocomplete="off" placeholder="Трек, артист или альбом" aria-label="Поиск"><button id="clear" class="clear" aria-label="Очистить">×</button></div></section>
<div class="tabs"><button class="tab active" data-tab="all">Все</button><button class="tab" data-tab="tracks">Треки</button><button class="tab" data-tab="artists">Артисты</button></div>
<section id="searchResults" class="searchResults"></section>
<div id="homeSections" class="homeSections">
<section><div class="sectionHead"><h2>Популярное</h2><button id="allBtn">Все</button></div><div id="tracks" class="tracks"></div></section>
<section><div class="sectionHead"><h2>Артисты</h2></div><div id="artists" class="artists"></div></section>
</div></main>
<div id="player" class="player hidden"><div class="playerTop"><div id="playerCover" class="cover"></div><div class="pinfo"><b id="pTitle">—</b><span id="pArtist">—</span></div><div class="ctrls"><button id="prev" class="ctrl" aria-label="Предыдущий">⏮</button><button id="play" class="play" aria-label="Воспроизвести">▶</button><button id="next" class="ctrl" aria-label="Следующий">⏭</button></div></div><div class="progress"><span id="cur" class="t">0:00</span><input id="bar" class="bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Перемотка"><span id="dur" class="t">0:00</span></div></div>
<audio id="audio" preload="metadata"></audio>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let tracks=[],artists=[],current=null,activeTab='all';const $=s=>document.querySelector(s),audio=$('#audio');
const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const letter=s=>(s||'?').trim().charAt(0).toUpperCase()||'?';
const norm=s=>(s||'').trim().toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/\s+/g,' ');
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const coverHtml=t=>t?.thumb_file_id?`<img src="/api/thumb/${encodeURIComponent(t.id)}" alt="">`:escapeHtml(letter(t?.title));
function uniqueArtists(){const map=new Map();for(const t of tracks){const key=norm(t.artist)||'неизвестный артист';if(!map.has(key))map.set(key,{name:(t.artist||'Неизвестный артист').trim(),count:0,trackIds:[]});const a=map.get(key);a.count++;a.trackIds.push(t.id)}return [...map.values()]}
function renderTracks(list=tracks){const box=$('#tracks');if(!list.length){box.innerHTML='<div class="empty">Ничего не найдено.</div>';return}box.innerHTML=list.map(t=>{const i=tracks.indexOf(t);return `<div class="track${i===current?' active':''}" data-i="${i}"><div class="cover">${coverHtml(t)}</div><div class="meta"><b>${escapeHtml(t.title)}</b><span>${escapeHtml(t.artist)}</span></div><span class="duration">${fmt(t.duration)}</span><button class="more" aria-label="Ещё">⋮</button></div>`}).join('');box.querySelectorAll('.track').forEach(x=>x.onclick=e=>{if(e.target.closest('.more'))return;playTrack(+x.dataset.i)})}
function artistCard(a,small=false){return `<div class="${small?'resultArtist':'artist'}"><button class="artistBtn" data-artist="${escapeHtml(a.name)}"><div class="avatar">${letter(a.name)}</div><span class="artistName">${escapeHtml(a.name)}</span><span class="count">${a.count} ${a.count===1?'трек':'треков'}</span></button></div>`}
function bindArtistClicks(root){root.querySelectorAll('[data-artist]').forEach(b=>b.onclick=()=>filterArtist(b.dataset.artist))}
function renderArtists(){const box=$('#artists');box.innerHTML=artists.length?artists.map(a=>artistCard(a)).join(''):'<div class="empty">Артисты появятся после загрузки музыки.</div>';bindArtistClicks(box)}
function filterArtist(name){$('#search').value=name;$('#clear').classList.add('show');activeTab='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='all'));showSearch(name)}
function playTrack(i){if(i<0||i>=tracks.length)return;current=i;const t=tracks[i];audio.src=`/api/stream/${encodeURIComponent(t.id)}`;audio.play().catch(()=>{});$('#player').classList.remove('hidden');$('#pTitle').textContent=t.title||'Без названия';$('#pArtist').textContent=t.artist||'Неизвестный артист';$('#playerCover').innerHTML=coverHtml(t);renderTracks();tg?.HapticFeedback?.impactOccurred('light')}
function togglePlay(){if(!tracks.length)return;if(current===null){playTrack(0);return}audio.paused?audio.play().catch(()=>{}):audio.pause()}
$('#play').onclick=togglePlay;$('#prev').onclick=()=>tracks.length&&playTrack((current-1+tracks.length)%tracks.length);$('#next').onclick=()=>tracks.length&&playTrack((current+1)%tracks.length);audio.onplay=()=>$('#play').textContent='❚❚';audio.onpause=()=>$('#play').textContent='▶';audio.onended=()=>$('#next').click();audio.onloadedmetadata=()=>$('#dur').textContent=fmt(audio.duration);audio.ontimeupdate=()=>{$('#cur').textContent=fmt(audio.currentTime);if(audio.duration)$('#bar').value=audio.currentTime/audio.duration*100};$('#bar').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
function showSearch(q){q=q.trim();if(!q){$('#searchResults').classList.remove('show');$('#homeSections').classList.remove('hide');return}$('#homeSections').classList.add('hide');$('#searchResults').classList.add('show');const needle=norm(q);const artistMatches=artists.filter(a=>norm(a.name).includes(needle));const trackMatches=tracks.filter(t=>norm((t.title||'')+' '+(t.artist||'')).includes(needle));let html='';if(activeTab!=='tracks'){html+=`<div class="resultTitle">Артисты · ${artistMatches.length}</div>`;html+=artistMatches.length?`<div class="artistResults">${artistMatches.slice(0,12).map(a=>artistCard(a,true)).join('')}</div>`:'<div class="empty">Артистов не найдено</div>'}if(activeTab!=='artists'){html+=`<div class="resultTitle">Треки · ${trackMatches.length}</div>`;if(trackMatches.length){html+=`<div class="tracks">${trackMatches.map(t=>{const i=tracks.indexOf(t);return `<div class="track${i===current?' active':''}" data-i="${i}"><div class="cover">${coverHtml(t)}</div><div class="meta"><b>${escapeHtml(t.title)}</b><span>${escapeHtml(t.artist)}</span></div><span class="duration">${fmt(t.duration)}</span></div>`}).join('')}</div>`}else html+='<div class="empty">Треков не найдено</div>'}$('#searchResults').innerHTML=html;bindArtistClicks($('#searchResults'));$('#searchResults').querySelectorAll('.track[data-i]').forEach(x=>x.onclick=()=>playTrack(+x.dataset.i))}
$('#search').oninput=e=>{$('#clear').classList.toggle('show',!!e.target.value);showSearch(e.target.value)};$('#clear').onclick=()=>{$('#search').value='';$('#clear').classList.remove('show');showSearch('');$('#search').focus()};document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));showSearch($('#search').value)});$('#allBtn').onclick=()=>{$('#search').value='';$('#clear').classList.remove('show');showSearch('');window.scrollTo({top:0,behavior:'smooth'})};
async function loadTracks(){try{const res=await fetch('/api/tracks',{cache:'no-store'});const data=await res.json();tracks=data.tracks||[];artists=uniqueArtists();renderTracks();renderArtists();if($('#search').value)showSearch($('#search').value)}catch(e){$('#tracks').innerHTML='<div class="empty">Не удалось загрузить музыку.<br>Проверь подключение к серверу.</div>'}}
async function sync(){const btn=$('#syncBtn');btn.disabled=true;btn.textContent='…';try{const res=await fetch('/api/sync',{method:'POST'});const data=await res.json();if(!res.ok)tg?.showAlert?.(data.error||'Ошибка синхронизации');else{await loadTracks();tg?.showAlert?.(`Добавлено новых треков: ${data.added}`)}}catch(e){tg?.showAlert?.('Ошибка сети')}finally{btn.disabled=false;btn.textContent='↻'}}
$('#syncBtn').onclick=sync;$('#profileBtn').onclick=()=>tg?.showAlert?.('Профиль добавим следующим этапом.');loadTracks();
</script>
</body></html>
